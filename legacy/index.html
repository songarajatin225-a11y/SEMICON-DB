<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Semiconductor Equipment Atlas</title>
<meta name="description" content="Batch-1 source-backed intelligence on semiconductor equipment OEMs, suppliers and startups for TEAL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed rail of 25 views beside one work surface; every view leads with a summary strip, then the evidence table. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --sunk:#EAF0F0; --ink:#12272A; --ink-2:#4B5E61; --ink-3:#768588;
  --line:#D8E1E1; --line-2:#E8EEEE; --teal:#00B7BA; --teal-ink:#00696C; --teal-wash:#DFF3F3; --grey:#808084;
  --r1:#00676A; --r2:#00A3A6; --r3:#5ABFC1; --rn:#B7BCBD; --warn:#9A5B00; --warn-wash:#FFF1D6; --crit:#A83232;
  --shadow:0 1px 2px rgba(18,39,42,.06),0 8px 24px rgba(18,39,42,.08);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  --s-xs:11px; --s-sm:12.5px; --s-md:14px; --s-lg:17px; --s-xl:24px; --s-2xl:34px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1517; --surface:#142024; --sunk:#101B1E; --ink:#E3EDEE; --ink-2:#A7B7B9; --ink-3:#7C8E91;
  --line:#26373B; --line-2:#1B2A2E; --teal:#1FC3C6; --teal-ink:#5FD9DB; --teal-wash:#113539; --grey:#8C8C90;
  --r1:#5FD9DB; --r2:#00A7AA; --r3:#0B6E71; --rn:#3B4A4E; --warn:#E8B04E; --warn-wash:#3A2C12; --crit:#E07070;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1517; --surface:#142024; --sunk:#101B1E; --ink:#E3EDEE; --ink-2:#A7B7B9; --ink-3:#7C8E91;
  --line:#26373B; --line-2:#1B2A2E; --teal:#1FC3C6; --teal-ink:#5FD9DB; --teal-wash:#113539; --grey:#8C8C90;
  --r1:#5FD9DB; --r2:#00A7AA; --r3:#0B6E71; --rn:#3B4A4E; --warn:#E8B04E; --warn-wash:#3A2C12; --crit:#E07070;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s-md);line-height:1.45;margin:0}
a{color:var(--teal-ink)} a:hover{text-decoration-thickness:2px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-inline:14px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:15px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-size:var(--s-xs);color:var(--ink-3);font-weight:400;letter-spacing:.3px}
.asof{font-size:var(--s-xs);color:var(--ink-3);margin:0 0 14px 42px}
.navgrp{margin-top:14px}
.navgrp h4{margin:0 0 4px;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.navgrp button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:13px}
.navgrp button:hover{background:var(--sunk);color:var(--ink)}
.navgrp button[aria-current="page"]{background:var(--teal-wash);color:var(--teal-ink);font-weight:600}
.navgrp button span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
/* main */
main{min-width:0;padding-block:18px 60px;padding-inline:28px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:18px}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 10px}
.filters select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 6px;font-size:12.5px;max-width:170px}
.filters .reset{border:1px solid var(--line);background:none;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.filters .count{font-size:12px;color:var(--ink-3);margin-left:auto}
.fold{display:none}
h1.vt{font-family:var(--f-display);font-stretch:118%;font-weight:760;font-size:var(--s-2xl);letter-spacing:-.3px;margin:0;text-wrap:balance;line-height:1.05}
.lede{color:var(--ink-2);max-width:78ch;margin:8px 0 18px}
h2{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:var(--s-lg);margin:0 0 10px;text-wrap:balance}
h3{font-size:13px;margin:0 0 6px;font-weight:600}
.eyebrow{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--teal-ink);font-weight:600;margin-bottom:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel .note{font-size:var(--s-xs);color:var(--ink-3);margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.section{margin-top:22px}
/* chips & meters */
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.2px;padding:1px 7px;border-radius:999px;border:1px solid transparent}
.chip.k1{background:var(--r1);color:var(--surface)}
.chip.k2{border-color:var(--r2);color:var(--teal-ink);background:var(--teal-wash)}
.chip.k3{border-color:var(--r3);color:var(--ink-2)}
.chip.k4{border:1px dashed var(--rn);color:var(--ink-3)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pot{font-weight:700;font-size:11px;padding:1px 8px;border-radius:5px;white-space:nowrap}
.pot.HIGH{background:var(--r1);color:var(--surface)} .pot.MEDIUM{background:var(--teal-wash);color:var(--teal-ink);border:1px solid var(--r2)} .pot.LOW{border:1px dashed var(--rn);color:var(--ink-3)}
.conf{display:inline-flex;gap:2px;vertical-align:middle;margin-right:5px}
.conf i{width:5px;height:11px;border-radius:1px;background:var(--line)}
.conf i.on{background:var(--r2)}
/* bars */
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(90px,var(--lw,150px)) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .trk{height:14px;background:var(--line-2);border-radius:0 4px 4px 0;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--r2);border-radius:0 4px 4px 0;min-width:2px}
.bar .val{font-variant-numeric:tabular-nums;color:var(--ink);font-size:12px;white-space:nowrap}
.bar.click{cursor:pointer} .bar.click:hover .lab{color:var(--teal-ink)}
.stack{display:flex;gap:2px;height:18px;border-radius:4px;overflow:hidden;margin:6px 0}
.stack div{min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stackrow{margin-bottom:12px}
.stackrow h3{display:flex;justify-content:space-between}
/* process chain */
.chain{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:var(--surface);cursor:pointer;min-width:0;text-align:left}
.step:hover{border-color:var(--teal)}
.step .n{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.step .t{font-size:12px;font-weight:600;line-height:1.2;margin:2px 0 6px;min-height:2.4em}
.step .c{font-family:var(--f-display);font-weight:750;font-size:20px;font-variant-numeric:tabular-nums}
.step .c.z{color:var(--ink-3)}
.step .h{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.step .h b{display:block;height:100%;background:var(--r2)}
/* tables */
.tbl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:72vh;overflow-y:auto}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--sunk);z-index:1;text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.tbl th button{border:0;background:none;padding:8px 10px;width:100%;text-align:inherit;cursor:pointer;font-weight:600;font-size:11.5px;letter-spacing:.2px;color:inherit}
.tbl th[aria-sort] button::after{content:" ▾";color:var(--teal-ink)} .tbl th[aria-sort="ascending"] button::after{content:" ▴"}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;max-width:340px}
.tbl tr[data-open]{cursor:pointer} .tbl tr[data-open]:hover td{background:var(--teal-wash)}
.tbl td.wrap{white-space:normal;min-width:180px}
.tbl td .sub{display:block;font-size:11px;color:var(--ink-3)}
.tbl input[type=checkbox]{accent-color:var(--teal)}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
/* taxonomy */
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.cat>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary b{font-family:var(--f-display);font-stretch:110%;font-weight:720;font-size:15px}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;padding:0 14px 14px}
.node{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-size:12.5px;background:none;text-align:left;cursor:pointer}
.node:hover{border-color:var(--teal)}
.node.zero{color:var(--ink-3)}
.node .cnt{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.node .cnt b{color:var(--teal-ink)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .code{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}
.card dt{color:var(--ink-3)} .card dd{margin:0}
/* compare */
.cmp-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cmp-pick select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;max-width:100%}
.cmp-pick .x{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;cursor:pointer}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface)}
.cmp th,.cmp td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left;min-width:170px}
.cmp th{background:var(--sunk);font-weight:600} .cmp td:first-child{color:var(--ink-3);min-width:130px;font-weight:600}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;overflow-y:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-inline:22px}
.drawer .close{position:sticky;top:0;float:right;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer}
.drawer h2{font-size:22px;margin-top:4px}
.drawer dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:5px 12px;font-size:12.5px;margin:10px 0 16px}
.drawer dt{color:var(--ink-3)} .drawer dd{margin:0;min-width:0;overflow-wrap:anywhere}
.drawer h3{margin-top:16px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3)}
.drawer ul{margin:0;padding-left:18px;font-size:12.5px} .drawer li{margin-bottom:5px}
.srcs li{list-style:none;margin-left:-18px;border-left:3px solid var(--line);padding-left:9px}
.srcs li.t1{border-color:var(--r1)} .srcs li.t2{border-color:var(--r2)} .srcs li.t3{border-color:var(--r3)}
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.25);z-index:19}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;box-shadow:var(--shadow)}
.callout{border:1px solid var(--line);border-left:3px solid var(--grey);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin:0 0 16px}
.list{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)} .list li{margin-bottom:4px}
.meter{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:7px}
.meter .trk{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.meter .trk b{display:block;height:100%;background:var(--r1)}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .chain{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding-block:10px 4px;padding-inline:16px;display:block;overflow:visible}
  #nav{display:flex;gap:12px;overflow-x:auto;margin-top:8px;padding-bottom:6px;scrollbar-width:thin}
  .rail .asof{display:none} .brand{margin:0} .brand small{display:none} .brand svg{width:24px;height:24px} .brand b{font-size:14px}
  .navgrp{margin:0;display:flex;gap:2px;flex:none} .navgrp h4{display:none} .navgrp button{white-space:nowrap;width:auto} .navgrp button span{display:none}
  main{padding-inline:16px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fold{display:inline-block;border:1px solid var(--line);background:none;border-radius:7px;padding:5px 10px}
  .filters.closed select,.filters.closed .reset{display:none}
  h1.vt{font-size:26px}
}
@media (max-width:520px){ .g4{grid-template-columns:minmax(0,1fr)} .chain{grid-template-columns:repeat(2,minmax(0,1fr))} .bar{--lw:110px} .drawer dl{grid-template-columns:100px minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .fill,.meter .trk b{transition:width .35s ease} }
</style>
</head>

    ["Semiconductor revenue", esc(c.semi)], ["Market class", esc(pretty(c.cc)) + `<br><span class="muted">${esc(c.ccb)}</span>`], ["Focus", esc(c.f)], ["Confirmed categories", esc(c.eq)],
    ["Candidate categories", isNA(c.cand) ? NA : esc(c.cand) + ` <span class="muted">(analyst knowledge, unverified)</span>`], ["India presence", esc(c.ind)], ["Evidence depth", esc(pretty(c.evd))], ["Notes", esc(c.note)]])}
  ${prods.length ? `<h3>Products (${prods.length})</h3><ul>${prods.map(p => `<li><a href="#" data-open="pr:${p.id}">${esc(p.fam)}${p.mdl !== NA ? " · " + esc(p.mdl) : ""}</a> <span class="muted">${esc(p.eqid)}</span></li>`).join("")}</ul>` : ""}
  ${crs.length ? `<h3>Customers (${crs.length})</h3><ul>${crs.map(r => `<li>${esc(r.cust)} · ${esc(r.stage)} ${chip(r.st)} <span class="mono muted">${esc(r.src)}</span></li>`).join("")}</ul>` : ""}
  ${sps.length ? `<h3>Supply links</h3><ul>${sps.map(s => `<li>${chip(s.type)} ${esc(s.sup)} → ${esc(s.oem)}: ${esc(s.comp)}</li>`).join("")}</ul>` : ""}
  ${pas.length ? `<h3>Deals and partnerships</h3><ul>${pas.map(p => `<li><span class="mono">${esc(p.date)}</span> ${esc(p.type)}: ${esc(p.a)} · ${esc(p.b)} ${esc(isNA(p.val) ? "" : "(" + p.val + ")")} <span class="muted">${esc(p.st)}</span></li>`).join("")}</ul>` : ""}
  ${ind.length ? `<h3>India footprint</h3><ul>${ind.map(r => `<li>${esc(r.typ)}: ${esc(r.fac)} ${isNA(r.loc) ? "" : "· " + esc(r.loc)} <span class="muted">${esc(r.st)}</span></li>`).join("")}</ul>` : ""}
  ${fins.length ? `<h3>Financials (fiscal years kept separate)</h3><ul>${fins.map(f => `<li>${esc(f.m)} · ${esc(f.fy)}: ${esc(f.ccy)} ${typeof f.v === "number" ? fmt0(f.v) : esc(f.v)}${f.ccy === "%" ? "" : " m"}${typeof f.usd === "number" && f.ccy !== "USD" ? ` ≈ USD ${fmt0(f.usd)} m` : ""} <span class="muted">${esc(f.vt)} · ${esc(f.src)}</span></li>`).join("")}</ul>` : ""}
  <h3>Sources</h3>${srcList(c.src)}`;
}
function openPr(id){
  const p = PR[id]; if (!p) return;
  const crs = D.cr.filter(r => r.pid === id);
  return `<div class="eyebrow">${esc(p.id)} · ${esc(p.eqid)} · ${esc(p.psn)}</div><h2>${esc(p.fam)}${p.mdl !== NA ? " · " + esc(p.mdl) : ""}</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${chip(p.ver)} ${conf(p.cl)} <span class="pill">${esc(pretty(p.st))} · ${esc(p.mat)}</span></div>
  ${dl([["Company", `<a href="#" data-open="co:${p.co}">${esc(p.cn)}</a>`], ["Equipment", esc(p.eq)], ["Technology", esc(p.tech)], ["Application", esc(p.app)], ["Segment", esc(p.seg)], ["Wafer / substrate", esc(p.wafer)],
    ["Throughput", esc(p.thr)], ["Accuracy", esc(p.acc)], ["Laser type", esc(p.lt)], ["Laser source", esc(p.ls)], ["Wavelength", esc(p.wl)], ["Power", esc(p.pw)], ["Pulse duration", esc(p.pd)], ["Pulse energy", esc(p.pe)],
    ["Repetition rate", esc(p.rr)], ["Scan / speed", esc(p.scan)], ["Material", esc(p.lmat)], ["Thickness", esc(p.thk)], ["Motion", esc(p.motion)], ["Footprint", esc(p.dims)], ["Price (public)", esc(p.price)],
    ["Maturity evidence", esc(p.mev)], ["TEAL portfolio", esc(p.teal)], ["Newest source age", esc(pretty(p.age))], ["Notes", esc(p.note)]])}
  ${(p.specs || []).length ? `<h3>Stated specifications</h3><ul>${p.specs.map(s => `<li>${esc(s[0])}: <b>${esc(s[1])}</b> ${esc(s[2] === NA ? "" : s[2])}</li>`).join("")}</ul>` : ""}
  ${crs.length ? `<h3>Customer evidence</h3><ul>${crs.map(r => `<li>${esc(r.cust)} · ${esc(r.stage)} ${chip(r.st)}</li>`).join("")}</ul>` : ""}
  <p><button class="reset" data-cmpadd="${p.id}">${state.cmp.includes(p.id) ? "In comparison" : "Add to comparison"}</button></p>
  <h3>Sources</h3>${srcList(p.src)}`;
}
function openRec(key){
  if (!key) return; const [t, id] = key.split(":");
  const html = t === "co" ? openCo(id) : t === "pr" ? openPr(id) : null; if (!html) return;
  const d = $("#drawer"); d.innerHTML = `<button class="close" id="dclose">Close</button>` + html; d.hidden = false; $("#scrim").hidden = false; d.scrollTop = 0; $("#dclose").focus();
}
function closeRec(){ $("#drawer").hidden = true; $("#scrim").hidden = true; }

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target;
  const nv = t.closest("[data-view]"); if (nv){ go(nv.dataset.view); return; }
  if (t.closest("#dclose") || t.id === "scrim"){ closeRec(); return; }
  const srt = t.closest("[data-sort]"); if (srt){ const [id, k] = srt.dataset.sort.split("|"); const s = state.sort[id]; state.sort[id] = {k, d: s && s.k === k ? -s.d : (k === "rev" || k === "cs" || k === "np" || k === "used" ? -1 : 1)}; render(false); return; }
  const cb = t.closest("[data-cmp]"); if (cb){ const id = cb.dataset.cmp; if (cb.checked){ if (!state.cmp.includes(id)) state.cmp.push(id); if (state.cmp.length > 4) state.cmp.shift(); } else state.cmp = state.cmp.filter(x => x !== id); render(false); return; }
  const add = t.closest("[data-cmpadd]"); if (add){ const id = add.dataset.cmpadd; if (!state.cmp.includes(id)){ state.cmp.push(id); if (state.cmp.length > 4) state.cmp.shift(); } closeRec(); go("compare"); return; }
  const st = t.closest("[data-ps]"); if (st){ state.f = {...F0, ps: st.dataset.ps}; eqFilter = ""; renderFilters(); go("products"); return; }
  const eq = t.closest("[data-eq]"); if (eq){ eqFilter = eq.dataset.eq; go("products"); return; }
  if (t.closest("[data-clear-eq]")){ eqFilter = ""; render(false); return; }
  const g = t.closest("[data-go]"); if (g && g.dataset.go){ const [k, v] = g.dataset.go.split(":"); if (k === "country"){ state.f = {...F0, country: v}; renderFilters(); go("companies"); } return; }
  const op = t.closest("[data-open]"); if (op && op.dataset.open){ e.preventDefault(); openRec(op.dataset.open); }
});
document.addEventListener("change", e => { const s = e.target.closest("[data-slot]"); if (s){ const i = +s.dataset.slot; const cur = state.cmp.filter(id => PR[id]); if (s.value) cur[i] = s.value; else cur.splice(i, 1); state.cmp = [...new Set(cur.filter(Boolean))].slice(0, 4); render(false); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeRec(); if (e.key === "Enter" && e.target.matches("tr[data-open]")) openRec(e.target.dataset.open); });
const tip = $("#tip");
document.addEventListener("mousemove", e => { const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el || !el.dataset.tip){ tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8); tip.style.left = x + "px"; tip.style.top = y + "px"; });
document.addEventListener("scroll", () => { tip.hidden = true; }, true);
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== state.view && VMAP[h]) go(h); });
(function init(){ const h = location.hash.slice(1); if (VMAP[h]) state.view = h; renderFilters(); renderNav(); render(); })();
</script>
